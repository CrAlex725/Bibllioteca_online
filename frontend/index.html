<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AiLibrary - Acceso</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="auth-container">

    <!-- Formulario de LOGIN -->
    <form id="login-form" class="auth-form">
      <h2>Iniciar sesión</h2>
      <input type="email" id="login-email" placeholder="Correo electrónico" required>
      <input type="password" id="login-password" placeholder="Contraseña" required>
      <button type="submit">Entrar</button>
    </form>

    <!-- Formulario de REGISTRO -->
    <form id="register-form" class="auth-form hidden">
      <h2>Crear cuenta</h2>
      <input type="text" id="register-name" placeholder="Nombre completo" required>
      <input type="text" id="register-username" placeholder="Nombre de usuario" required>
      <input type="email" id="register-email" placeholder="Correo electrónico" required>
      <input type="password" id="register-password" placeholder="Contraseña" required>
      <button type="submit">Registrarme</button>
    </form>

    <!-- Mensajes de error / éxito -->
    <p id="mensaje" class="mensaje"></p>

    <!-- Enlace para alternar entre login y registro -->
    <p class="toggle">
      <span id="toggle-text">¿No tienes cuenta?</span>
      <a href="#" id="toggle-link">Regístrate</a>
    </p>

  </main>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
